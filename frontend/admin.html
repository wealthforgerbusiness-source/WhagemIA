<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Admin — WhagemIA</title>

  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#25D366" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <link rel="icon" href="/assets/icons/favicon.ico" />

  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/style.css" />

  <style>
    body { padding: 24px 16px 60px; max-width: 1100px; margin: 0 auto; }

    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .admin-header h1 { font-size: 20px; font-weight: 700; }

    #login-screen, #denied-screen {
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
    }

    .stat-card .value { font-size: 22px; font-weight: 700; }
    .stat-card .label { font-size: 12.5px; color: var(--color-text-muted); margin-top: 2px; }

    .users-table-wrap {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow-x: auto;
    }

    table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 780px; }

    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--color-border);
      white-space: nowrap;
    }

    th {
      font-weight: 600;
      color: var(--color-text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    tr:last-child td { border-bottom: none; }

    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
    }

    .badge.active { background: rgba(37,211,102,0.12); color: var(--color-primary-dark); }
    .badge.expired { background: rgba(239,68,68,0.12); color: var(--color-danger); }

    #search-input {
      padding: 9px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      font-family: var(--font-main);
      font-size: 13.5px;
      width: 100%;
      max-width: 280px;
    }

    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div id="login-screen" class="hidden">
    <img src="/assets/logo.png" alt="WhagemIA" style="width: 64px; height: 64px;" />
    <h1 style="font-size: 20px; font-weight: 700;">Espace admin</h1>
    <p class="text-muted">Connecte-toi avec le compte Google administrateur.</p>
    <button id="admin-login-btn" class="btn btn-google" style="max-width: 280px;">
      Continuer avec Google
    </button>
  </div>

  <div id="denied-screen" class="hidden">
    <h1 style="font-size: 20px; font-weight: 700; color: var(--color-danger);">Accès refusé</h1>
    <p class="text-muted">Ce compte n'a pas les droits administrateur.</p>
    <a href="/dashboard.html" class="btn" style="max-width: 220px;">Retour au dashboard</a>
  </div>

  <div id="admin-content" class="hidden">
    <div class="admin-header">
      <h1>Tableau de bord admin</h1>
      <button id="logout-btn" class="btn" style="width: auto; padding: 8px 16px; font-size: 13px;">
        Déconnexion
      </button>
    </div>

    <div class="stats-grid" id="stats-grid"></div>

    <div class="top-controls">
      <input type="text" id="search-input" placeholder="Chercher par email..." />
      <span id="results-count" class="text-muted" style="font-size: 13px;"></span>
    </div>

    <div class="users-table-wrap">
      <table>
        <thead>
          <tr>
            <th>Email</th>
            <th>Plan</th>
            <th>Statut</th>
            <th>Bot</th>
            <th>Tokens entrée</th>
            <th>Tokens sortie</th>
            <th>Renouvellement</th>
          </tr>
        </thead>
        <tbody id="users-tbody"></tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { auth, googleProvider } from '/js/firebase-config.js';
    import {
      onAuthStateChanged,
      signInWithPopup,
      signOut,
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const API_BASE = window.location.hostname === 'localhost'
      ? 'http://localhost:3000'
      : 'https://whagemia.onrender.com';

    const loginScreen = document.getElementById('login-screen');
    const deniedScreen = document.getElementById('denied-screen');
    const adminContent = document.getElementById('admin-content');

    let allUsers = [];
    let idToken = null;

    function showOnly(el) {
      [loginScreen, deniedScreen, adminContent].forEach((e) => e.classList.add('hidden'));
      el.classList.remove('hidden');
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        showOnly(loginScreen);
        return;
      }

      idToken = await user.getIdToken();

      try {
        const res = await fetch(`${API_BASE}/api/admin/overview`, {
          headers: { 'Authorization': `Bearer ${idToken}` },
        });

        if (res.status === 403) {
          showOnly(deniedScreen);
          return;
        }

        if (!res.ok) {
          throw new Error('Erreur serveur');
        }

        const data = await res.json();
        renderStats(data.stats);
        allUsers = data.users || [];
        renderUsers(allUsers);
        showOnly(adminContent);
      } catch (error) {
        console.error('Erreur chargement admin:', error);
        showOnly(deniedScreen);
      }
    });

    document.getElementById('admin-login-btn').addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (error) {
        console.error('Erreur connexion Google:', error);
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await signOut(auth);
      showOnly(loginScreen);
    });

    function renderStats(stats) {
      const grid = document.getElementById('stats-grid');
      const items = [
        { label: 'Utilisateurs', value: stats.totalUsers },
        { label: 'Actifs', value: stats.activeUsers },
        { label: 'Expirés', value: stats.expiredUsers },
        { label: 'Essai gratuit', value: stats.trialUsers },
        { label: 'Plan Start', value: stats.startUsers },
        { label: 'Plan Moyen', value: stats.moyenUsers },
        { label: 'Plan Premium', value: stats.premiumUsers },
        { label: 'Bots actifs', value: stats.botsActive },
        { label: 'Revenu estimé/mois', value: `$${stats.estimatedMonthlyRevenue}` },
      ];

      grid.innerHTML = items.map((item) => `
        <div class="stat-card">
          <div class="value">${item.value}</div>
          <div class="label">${item.label}</div>
        </div>
      `).join('');
    }

    function formatNumber(n) {
      n = Number(n || 0);
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
      if (n >= 1000) return (n / 1000).toFixed(0) + 'k';
      return n;
    }

    function formatDate(iso) {
      if (!iso) return '—';
      try {
        return new Date(iso).toLocaleDateString('fr-FR');
      } catch {
        return '—';
      }
    }

    function renderUsers(users) {
      const tbody = document.getElementById('users-tbody');
      const countEl = document.getElementById('results-count');

      countEl.textContent = `${users.length} compte(s)`;

      tbody.innerHTML = users.map((u) => `
        <tr>
          <td>${u.email || '—'}</td>
          <td>${u.plan || '—'}</td>
          <td><span class="badge ${u.status === 'active' ? 'active' : 'expired'}">${u.status || '—'}</span></td>
          <td>${u.botEnabled ? 'Actif' : 'Désactivé'}</td>
          <td>${formatNumber(u.tokensInUsed)} / ${formatNumber(u.tokensInLimit)}</td>
          <td>${formatNumber(u.tokensOutUsed)} / ${formatNumber(u.tokensOutLimit)}</td>
          <td>${formatDate(u.subscriptionRenewsAt)}</td>
        </tr>
      `).join('');
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      const query = e.target.value.trim().toLowerCase();
      const filtered = query
        ? allUsers.filter((u) => (u.email || '').toLowerCase().includes(query))
        : allUsers;
      renderUsers(filtered);
    });
  </script>

</body>
</html>
